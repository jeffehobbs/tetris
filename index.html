<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-title">TETRIS</div>
    <div class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="sidebar">
            <div class="stat-box">
                <div class="label">HIGH SCORE</div>
                <div id="high-score" class="value">0</div>
            </div>
            <div class="stat-box">
                <div class="label">SCORE</div>
                <div id="score" class="value">0</div>
            </div>
            <div class="stat-box">
                <div class="label">LINES</div>
                <div id="lines" class="value">0</div>
            </div>
            <div class="stat-box">
                <div class="label">NEXT</div>
                <canvas id="next" width="80" height="100"></canvas>
            </div>
            <button id="start-btn"><strong>Start Game</strong></button>
        </div>
    </div>
    <div class="footer">
        <div class="controls">
            ← → : <strong>Move</strong> | 
            ↑ : <strong>Rotate</strong> | 
            ↓ : <strong>Nudge Down</strong> | 
            Space : <strong>Drop</strong>
        </div>
        <div class="credits">Made with ❤️ by <a style="color: #95a5a6" href="https://bsky.app/profile/jeffehobbs.bsky.social" target="_blank">@jeffehobbs</a></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
